{{- if .Values.opa.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: opa
  labels:
    {{- include "zta-platform.labels" . | nindent 4 }}
    app: opa
spec:
  selector:
    app: opa
  ports:
    - name: http
      port: {{ .Values.opa.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.opa.grpcPort }}
      targetPort: grpc
{{- end }}
